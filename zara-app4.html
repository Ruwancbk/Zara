<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7a1f4b">
<title>Zara Looms</title>
<style>
:root{--p:#7a1f4b;--p2:#a8326a;--bg:#f6f1f4;--card:#fff;--tx:#241a20;--mut:#7b6a73;--ok:#1b8a4b;--bad:#c62828;--warn:#d98200;--line:#eadfe5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Noto Sans Sinhala","Iskoola Pota",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:78px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:19px}
header small{opacity:.85}
#gear{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px}
main{padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:10px}
.stat .l{font-size:12px;color:var(--mut)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h2{font-size:15px;margin:14px 2px 8px;color:var(--p)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .n{font-weight:600}
.item .s,.s{font-size:12px;color:var(--mut)}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#eee;white-space:nowrap;display:inline-block}
.b-ok{background:#dff3e6;color:var(--ok)}.b-bad{background:#fde3e3;color:var(--bad)}.b-warn{background:#fff0d6;color:var(--warn)}.b-p{background:#f3e1ec;color:var(--p)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--line);z-index:6}
nav button{flex:1;min-width:0;border:0;background:none;padding:7px 0 9px;font-size:9.5px;color:var(--mut)}
nav button b{display:block;font-size:18px;font-weight:400}
nav button.on{color:var(--p);font-weight:700}
.fab{position:fixed;right:16px;bottom:84px;background:var(--p);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.sheet h3{margin:0 0 10px;color:var(--p)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d9cbd3;border-radius:10px;font-size:15px;background:#fff;font-family:inherit}
input[readonly]{background:#f6f1f4}
.btn{border:0;border-radius:10px;padding:12px;font-size:15px;background:var(--p);color:#fff;width:100%;margin-top:14px}
.btn.sec{background:#efe4ea;color:var(--p)}
.btn.del{background:#fde3e3;color:var(--bad)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border:1px solid #d9cbd3;background:#fff;border-radius:10px;font-size:14px}
.seg button.on{background:var(--p);color:#fff;border-color:var(--p)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chips button{flex:0 0 auto;border:1px solid #d9cbd3;background:#fff;border-radius:20px;padding:7px 13px;font-size:13px}
.chips button.on{background:var(--p);color:#fff;border-color:var(--p)}
.total{background:#f6edf2;border-radius:10px;padding:10px;margin-top:10px;text-align:center}
.empty{text-align:center;color:var(--mut);padding:24px 0;font-size:14px}
.bar{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.search{margin-bottom:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--tx);margin:12px 0 4px}
.chk input{width:auto}
.rolebox{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.inst-h{background:linear-gradient(135deg,#f6e9f0,#fff);border-radius:12px;padding:10px 12px;margin:14px 0 6px}
.inst-h .t{font-weight:700;color:var(--p);font-size:16px}
.irow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:3px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{font-weight:600;color:var(--mut);text-align:right;padding:5px 3px;border-bottom:1px solid var(--line)}
table.tbl td{text-align:right;padding:6px 3px;border-bottom:1px solid var(--line)}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl tr:last-child td{border:0}
details.lot{border-top:1px solid var(--line);padding:8px 0}
details.lot summary{list-style:none;cursor:pointer}
details.lot summary::-webkit-details-marker{display:none}
[style*="text-align:right"]{white-space:nowrap}
.sl{font-size:12px;color:var(--mut);padding:4px 0 0 10px;display:flex;justify-content:space-between;gap:6px}
</style>
</head>
<body>
<header><img src="logo.png" alt="Zara Looms" style="width:44px;height:44px;border-radius:50%;background:#fff;padding:2px"><div><h1>Zara Looms</h1><small id="sub"></small></div><button id="gear" onclick="go('more')">⚙️</button></header>
<main id="main"></main>
<button class="fab" id="fab" onclick="openForm()">＋ අලුත්</button>
<nav>
  <button data-t="home"><b>🏠</b>මුල්</button>
  <button data-t="buy"><b>📥</b>ගැනීම්</button>
  <button data-t="sell"><b>📤</b>විකුණුම්</button>
  <button data-t="ret"><b>↩️</b>රිටන්</button>
  <button data-t="people"><b>👥</b>පුද්ගලයෝ</button>
  <button data-t="inst"><b>🏢</b>ආයතන</button>
  <button data-t="profit"><b>📊</b>ලාභ</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const KEY='sari_manager_v1';
let S={purchases:[],sales:[],contacts:[],items:[],returns:[]};
let tab='home', q='', pf='all', pitem='all';
const RL={supplier:'සැපයුම්කරු',customer:'ගැනුම්කරු',agent:'Agent'};
const DEF_ITEMS=[{id:'sari',name:'සාරි'},{id:'lungi',name:'ලුංගි'},{id:'tshirt',name:'ටී ෂර්ට්'},{id:'gown',name:'ගවුම්'},{id:'trouser',name:'කලිසම්'}];
try{const d=localStorage.getItem(KEY);if(d)S=JSON.parse(d);}catch(e){}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('දත්ත සුරැකීමට නොහැකි විය')}};
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>(n<0?'−':'')+'රු. '+Math.abs(Math.round(n||0)).toLocaleString('en-US');
const fdate=d=>d||'-';
const sum=(a,f)=>a.reduce((x,y)=>x+(+f(y)||0),0);
const cget=id=>S.contacts.find(x=>x.id===id);
const cname=r=>{const c=cget(r.cid);return c?c.name:r.party};
const iname=id=>{const i=S.items.find(x=>x.id===id);return i?i.name:'?'};

/* ---------- ගණනය ---------- */
const isSale=r=>('lotId' in r);
const paid=r=>sum(r.payments||[],p=>p.amount);
const retsOf=r=>S.returns.filter(x=>x.saleId===r.id);
const retQty=r=>sum(retsOf(r),x=>x.qty);
const retAmt=r=>sum(retsOf(r),x=>x.amount);
const refunded=r=>sum(retsOf(r),x=>x.refund);
const effQty=r=>isSale(r)?r.qty-retQty(r):r.qty;
const effTotal=r=>isSale(r)?r.total-retAmt(r):r.total;
const got=r=>isSale(r)?paid(r)-refunded(r):paid(r);
const bal=r=>Math.max(0,effTotal(r)-got(r));
const isOver=r=>bal(r)>0&&r.due&&r.due<today();
const profitOf=r=>isSale(r)?effQty(r)*((+r.unit||0)-(+r.cost||0)):0;
const lotSold=l=>sum(S.sales.filter(s=>s.lotId===l.id),s=>effQty(s));
const lotRem=l=>l.qty-lotSold(l);

function calc(){
  const bq=sum(S.purchases,r=>r.qty),bt=sum(S.purchases,r=>r.total),bp=sum(S.purchases,paid);
  const sq=sum(S.sales,effQty),st=sum(S.sales,effTotal),sp=sum(S.sales,got);
  const profit=sum(S.sales,profitOf),cogs=sum(S.sales,r=>effQty(r)*(+r.cost||0));
  const owe=sum(S.purchases,bal),recv=sum(S.sales,bal);
  const stockVal=sum(S.purchases,l=>Math.max(0,lotRem(l))*l.unit);
  return {stock:bq-sq,bq,sq,bt,bp,owe,st,sp,recv,profit,cogs,cash:sp-bp,stockVal};
}
function itemStats(){
  return S.items.map(it=>{
    const ps=S.purchases.filter(r=>r.itemId===it.id),ss=S.sales.filter(r=>r.itemId===it.id);
    const bq=sum(ps,r=>r.qty),sq=sum(ss,effQty),rq=sum(ss,retQty);
    const rev=sum(ss,effTotal),cost=sum(ss,r=>effQty(r)*(+r.cost||0));
    return {it,bq,sq,rq,stock:bq-sq,bt:sum(ps,r=>r.total),rev,cost,profit:rev-cost};
  });
}

/* වාරික දෙකක් ඇති නම්, ඊළඟට ගෙවිය යුතු වාරිකයේ දිනය r.due ලෙස තබයි */
function syncDue(r){
  if(!r.inst||!r.inst.length)return;
  if(bal(r)<=0)return;
  const p=got(r);let cum=r.instBase||0;
  for(const i of r.inst){cum+=i.amount;if(p<cum-0.5){r.due=i.due;return}}
}
function instStatus(r){
  if(!r.inst)return [];
  const p=got(r);let cum=r.instBase||0;
  return r.inst.map((i,k)=>{
    const before=cum;cum+=i.amount;
    const g=Math.max(0,Math.min(i.amount,p-before));
    const done=g>=i.amount-0.5;
    return {no:k+1,amount:i.amount,due:i.due,got:g,done,over:!done&&i.due&&i.due<today()};
  });
}

function norm(){
  S.purchases=S.purchases||[];S.sales=S.sales||[];S.contacts=S.contacts||[];S.returns=S.returns||[];
  if(!Array.isArray(S.items)||!S.items.length)S.items=DEF_ITEMS.map(x=>({id:x.id,name:x.name}));
  if(!S.items.some(i=>i.id==='sari'))S.items.unshift({id:'sari',name:'සාරි'});
  S.purchases.forEach(r=>{if(!r.itemId)r.itemId='sari'});
  S.sales.forEach(r=>{
    if(!r.itemId)r.itemId='sari';
    if(!('lotId' in r)){
      const ps=S.purchases.filter(p=>p.itemId===r.itemId);
      const q=sum(ps,p=>p.qty),t=sum(ps,p=>p.total);
      r.lotId='';r.cost=q?t/q:0;
    }
  });
  const recs=[...S.purchases.map(r=>({r,role:'supplier'})),...S.sales.map(r=>({r,role:null}))];
  recs.forEach(({r,role})=>{
    const rr=role||(r.kind==='agent'?'agent':'customer');
    if(!r.cid){
      let c=S.contacts.find(x=>x.name.trim().toLowerCase()===String(r.party).trim().toLowerCase());
      if(!c){c={id:uid(),name:String(r.party).trim(),phone:'',address:'',roles:[]};S.contacts.push(c)}
      r.cid=c.id;
    }
    const c=cget(r.cid);
    if(c){c.roles=c.roles||[];if(!c.roles.includes(rr))c.roles.push(rr)}
    syncDue(r);
  });
  S.contacts.forEach(c=>{if(!c.roles||!c.roles.length)c.roles=['customer']});
}

function go(t){tab=t;q='';render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const fabOn=['buy','sell','ret','people'].includes(tab);
  $('fab').style.display=fabOn?'block':'none';
  $('fab').textContent=tab==='buy'?'＋ සාරි/භාණ්ඩ ගැනීමක්':tab==='sell'?'＋ විකුණුමක්':tab==='ret'?'＋ රිටන් එකක්':tab==='people'?'＋ පුද්ගලයෙක්':'＋ අලුත්';
  const c=calc();
  $('sub').textContent='මුළු තොගය: '+c.stock;
  $('main').innerHTML=tab==='home'?home(c):tab==='buy'?list('buy'):tab==='sell'?list('sell'):tab==='ret'?returnsTab():tab==='people'?people():tab==='inst'?institutions():tab==='profit'?profitTab():more();
}

function phoneOf(r){const c=cget(r.cid);return c&&c.phone?'📞 '+esc(c.phone)+' • ':''}
function lotLabel(r){return esc(iname(r.itemId))+(r.note&&!isSale(r)?' ('+esc(r.note)+')':'')}

function home(c){
  const owe=S.purchases.filter(r=>bal(r)>0).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
  const rec=S.sales.filter(r=>bal(r)>0).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);
  const line=(r,t)=>`<div class="item" onclick="openDetail('${t}','${r.id}')"><div class="row"><div><div class="n">${esc(cname(r))}</div><div class="s">${phoneOf(r)}${esc(iname(r.itemId))} ${effQty(r)} • ගෙවිය යුතු දිනය: ${fdate(r.due)}${r.instName?'<br>🏢 '+esc(r.instName):''}</div></div><div style="text-align:right"><div class="${t==='buy'?'bad':'ok'}"><b>${rs(bal(r))}</b></div>${isOver(r)?'<span class="badge b-bad">කල් ඉකුත්</span>':''}</div></div></div>`;
  const st=itemStats();
  return `
  <div class="card"><div class="l s">දැන් ගාව තියෙන තොගය (භාණ්ඩ වර්ග අනුව)</div>
  <table class="tbl"><tr><th>භාණ්ඩය</th><th>තොගය</th><th>ගත්ත</th><th>විකුණපු</th><th>රිටන්</th></tr>
  ${st.map(x=>`<tr><td>${esc(x.it.name)}</td><td><b style="color:var(--p)">${x.stock}</b></td><td>${x.bq}</td><td>${x.sq}</td><td>${x.rq}</td></tr>`).join('')}
  <tr><td><b>එකතුව</b></td><td><b>${c.stock}</b></td><td>${c.bq}</td><td>${c.sq}</td><td>${sum(st,x=>x.rq)}</td></tr></table>
  <div class="s" style="margin-top:6px">ඉතිරි තොගයේ වටිනාකම (ගත්ත මිලට): <b>${rs(c.stockVal)}</b></div></div>
  <div class="grid">
    <div class="card stat"><div class="l">මුළු විකුණුම් (රිටන් අඩුකළ)</div><div class="v">${rs(c.st)}</div></div>
    <div class="card stat" onclick="go('profit')"><div class="l">මුළු ලාභය 📊</div><div class="v ${c.profit>=0?'ok':'bad'}">${rs(c.profit)}</div></div>
    <div class="card stat"><div class="l">ලැබිලා තියෙන මුදල</div><div class="v ok">${rs(c.sp)}</div></div>
    <div class="card stat"><div class="l">මට ලැබිය යුතු</div><div class="v warn">${rs(c.recv)}</div></div>
    <div class="card stat"><div class="l">භාණ්ඩ ගත්ත වටිනාකම</div><div class="v">${rs(c.bt)}</div></div>
    <div class="card stat"><div class="l">මම ගෙවිය යුතු</div><div class="v bad">${rs(c.owe)}</div></div>
  </div>
  <div class="card stat"><div class="l">අතේ ඉතුරු මුදල (ලැබුණු − ගෙවූ)</div><div class="v ${c.cash>=0?'ok':'bad'}">${rs(c.cash)}</div></div>
  <h2>📅 මම ගෙවන්න තියෙන ඒවා</h2><div class="card">${owe.length?owe.map(r=>line(r,'buy')).join(''):'<div class="empty">ගෙවන්න කිසිවක් නැත 🎉</div>'}</div>
  <h2>💰 මට ලැබෙන්න තියෙන ඒවා</h2><div class="card">${rec.length?rec.map(r=>line(r,'sell')).join(''):'<div class="empty">ලැබිය යුතු කිසිවක් නැත</div>'}</div>`;
}

function list(t){
  const k=q.toLowerCase();
  const arr=(t==='buy'?S.purchases:S.sales).slice().sort((a,b)=>a.date<b.date?1:-1)
    .filter(r=>{const c=cget(r.cid)||{};return !q||cname(r).toLowerCase().includes(k)||String(c.phone||'').includes(q)||iname(r.itemId).toLowerCase().includes(k)});
  const tot=sum(arr,effTotal);
  return `<input class="search" placeholder="🔍 නමින්, අංකයෙන් හෝ භාණ්ඩයෙන් සොයන්න" value="${esc(q)}" oninput="q=this.value;render();this.focus()">
  <div class="card row"><span>${arr.length} ඇතුළත් කිරීම්</span><b>${rs(tot)}</b></div>
  <div class="card">${arr.length?arr.map(r=>{
    const b=bal(r);
    const st=b<=0?'<span class="badge b-ok">සම්පූර්ණයි</span>':isOver(r)?'<span class="badge b-bad">කල් ඉකුත්</span>':'<span class="badge b-warn">ඉතිරියක් ඇත</span>';
    const pct=effTotal(r)?Math.min(100,got(r)/effTotal(r)*100):100;
    const rq=isSale(r)?retQty(r):0;
    return `<div class="item" onclick="openDetail('${t}','${r.id}')"><div class="row"><div><div class="n">${esc(cname(r))}${r.kind==='agent'?' <span class="badge">Agent</span>':''}</div><div class="s">${phoneOf(r)}<b>${lotLabel(r)}</b> • ${r.qty} × ${rs(r.unit)}<br>${fdate(r.date)} • ${r.type==='cash'?'අත්පිට':'නයට'}${r.instName?' • 🏢 '+esc(r.instName):''}${rq?' • ↩️ රිටන් '+rq:''}</div></div><div style="text-align:right"><b>${rs(effTotal(r))}</b><br>${st}${isSale(r)?`<div class="s ${profitOf(r)>=0?'ok':'bad'}">ලාභ ${rs(profitOf(r))}</div>`:''}</div></div>
    ${b>0?`<div class="bar"><i style="width:${pct}%"></i></div><div class="s">ගෙවූ ${rs(got(r))} • ඉතිරි <b>${rs(b)}</b> • ඊළඟ දිනය ${fdate(r.due)}</div>`:''}</div>`}).join(''):'<div class="empty">තවම ඇතුළත් කර නැත.<br>පහළ බොත්තමෙන් එකතු කරන්න.</div>'}</div>`;
}

  <div class="card">${arr.length?arr.map(x=>{const c=cget(x.cid)||{name:'?'};return `<div class="item" onclick="openReturn('${x.id}')"><div class="row"><div><div class="n">${esc(c.name)}</div><div class="s">${esc(iname(x.itemId))} • ${x.qty} ක් • දිනය: ${fdate(x.date)}${x.note?'<br>'+esc(x.note):''}</div></div><div style="text-align:right"><b class="bad">${rs(x.amount)}</b>${x.refund>0?`<div class="s">ආපසු ගෙවූ ${rs(x.refund)}</div>`:''}</div></div></div>`}).join(''):'<div class="empty">රිටන් කිසිවක් ඇතුළත් කර නැත.<br>පහළ බොත්තමෙන් එකතු කරන්න.</div>'}</div>`;
}
function openReturnForm(saleId){

  const ppl=S.contacts.filter(c=>S.sales.some(s=>s.cid===c.id)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!ppl.length)return alert('රිටන් එකක් ඇතුළත් කිරීමට මුලින් විකුණුමක් තිබිය යුතුයි');
  window.RF={touched:false};
  $('sheet').innerHTML=`<h3>↩️ රිටන් එකක්</h3>
  <label>රිටන් කළේ කවුද (නම) *</label><select id="rf_p" onchange="rfPerson()"><option value="">— තෝරන්න —</option>${ppl.map(c=>`<option value="${c.id}" ${sale&&sale.cid===c.id?'selected':''}>${esc(c.name)}${c.phone?' • '+esc(c.phone):''}</option>`).join('')}</select>
  <label>මොන විකුණුමෙන්ද *</label><select id="rf_s" onchange="rfSale()"></select>
  <div class="grid"><div><label>රිටන් ගණන</label><input type="number" inputmode="numeric" id="rf_q" oninput="rfCalc()"></div><div><label>රිටන් වටිනාකම</label><input id="rf_a" readonly value="රු. 0"></div></div>
  <label>මුදල් ආපසු ගෙවූවා නම් (රු.)</label><input type="number" inputmode="decimal" id="rf_ref" oninput="RF.touched=true" placeholder="0">
  <div class="s" id="rf_hint" style="margin-top:4px"></div>
  <label>රිටන් කළ දිනය (අවශ්‍ය නම් පමණක්)</label><input type="date" id="rf_d">
  <label>හේතුව / සටහන (අවශ්‍ය නම්)</label><input id="rf_n">
  <button class="btn" onclick="saveReturn()">සුරකින්න</button><button class="btn sec" onclick="closeM()">අවලංගු</button>`;
  $('modal').classList.add('show');
  rfPerson(saleId);
}
function rfPerson(pre){
  const cid=$('rf_p').value;
  const ss=S.sales.filter(s=>s.cid===cid&&s.qty-retQty(s)>0).sort((a,b)=>a.date<b.date?1:-1);
  $('rf_s').innerHTML=cid?(ss.length?ss.map(s=>`<option value="${s.id}" ${pre===s.id?'selected':''}>${esc(iname(s.itemId))} • ${s.qty-retQty(s)} × ${rs(s.unit)} • ${fdate(s.date)}</option>`).join(''):'<option value="">රිටන් කළ හැකි විකුණුමක් නැත</option>'):'<option value="">— මුලින් නම තෝරන්න —</option>';
  rfSale();
}
function rfSale(){$('rf_q').value='';RF.touched=false;$('rf_ref').value='';rfCalc()}
function rfCalc(){
  const s=S.sales.find(x=>x.id===$('rf_s').value);
  if(!s){$('rf_a').value='රු. 0';$('rf_hint').textContent='';return}
  const max=s.qty-retQty(s);const qn=Math.min(+$('rf_q').value||0,max);
  const amount=qn*s.unit;$('rf_a').value=rs(amount);
  const over=got(s)-(effTotal(s)-amount);
  const def=Math.max(0,Math.min(amount,over));
  if(!RF.touched)$('rf_ref').value=def>0?Math.round(def):'';
  $('rf_hint').textContent='උපරිම රිටන් ගණන: '+max+(def>0?' • දැනටමත් ගෙවා ඇති නිසා ආපසු ගෙවිය යුතු: '+rs(def):'');
}
function saveReturn(){
  const cid=$('rf_p').value;
  if(!cid)return alert('රිටන් කළ කෙනාගේ නම තෝරන්න');
  const s=S.sales.find(x=>x.id===$('rf_s').value);
  if(!s)return alert('විකුණුමක් තෝරන්න');
  const qn=+$('rf_q').value,max=s.qty-retQty(s);
  if(!(qn>0))return alert('රිටන් ගණන ඇතුළත් කරන්න');
  if(qn>max)return alert('රිටන් ගණන උපරිම ('+max+') ට වඩා වැඩියි');
  const amount=qn*s.unit,refund=+$('rf_ref').value||0;
  if(refund<0||refund>amount+0.5)return alert('ආපසු ගෙවූ මුදල රිටන් වටිනාකමට වඩා වැඩි විය නොහැක');
  S.returns.push({id:uid(),cid,saleId:s.id,itemId:s.itemId,lotId:s.lotId,qty:qn,amount,refund,date:$('rf_d').value||'',note:$('rf_n').value.trim(),ts:Date.now()});
  syncDue(s);save();closeM();render();
}
function openReturn(id){
  const x=S.returns.find(r=>r.id===id);if(!x)return;const c=cget(x.cid)||{name:'?'};
  $('sheet').innerHTML=`<h3>↩️ ${esc(c.name)}</h3>
  <div class="card" style="box-shadow:none;background:#faf5f8"><div class="s" style="line-height:1.9;font-size:14px;color:var(--tx)">${c.phone?`📞 <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a><br>`:''}භාණ්ඩය: <b>${esc(iname(x.itemId))}</b><br>රිටන් ගණන: <b>${x.qty}</b><br>රිටන් වටිනාකම: <b class="bad">${rs(x.amount)}</b><br>ආපසු ගෙවූ මුදල: <b>${rs(x.refund)}</b><br>දිනය: ${fdate(x.date)}${x.note?'<br>සටහන: '+esc(x.note):''}</div></div>
  <button class="btn" onclick="closeM();openDetail('sell','${x.saleId}')">මූල විකුණුම බලන්න</button>
  <button class="btn del" onclick="delReturn('${id}')">මෙම රිටන් එක මකන්න</button><button class="btn sec" onclick="closeM()">වසන්න</button>`;
  $('modal').classList.add('show');
}
function delReturn(id){
  if(!confirm('මෙම රිටන් එක මකන්නද? (තොගය සහ ලාභය නැවත ගණනය වේ)'))return;
  const x=S.returns.find(r=>r.id===id);S.returns=S.returns.filter(r=>r.id!==id);
  const s=x&&S.sales.find(r=>r.id===x.saleId);if(s)syncDue(s);
  save();closeM();render();
}

function profitTab(){
  const c=calc(),st=itemStats().filter(x=>pitem==='all'||x.it.id===pitem);
  const chip=(k,l)=>`<button class="${pitem===k?'on':''}" onclick="pitem='${k}';render()">${l}</button>`;
  const body=st.map(x=>{
    const lots=S.purchases.filter(p=>p.itemId===x.it.id).sort((a,b)=>a.date<b.date?1:-1);
    const legacy=S.sales.filter(s=>s.itemId===x.it.id&&!s.lotId);
    const lotRows=lots.map(l=>{
      const ss=S.sales.filter(s=>s.lotId===l.id);
      const sq=sum(ss,effQty),pr=sum(ss,profitOf),rev=sum(ss,effTotal);
      const prices=[...new Set(ss.map(s=>s.unit))].sort((a,b)=>a-b);
      return `<details class="lot"><summary><div class="row"><div><b>රු. ${Math.round(l.unit).toLocaleString('en-US')} ට ගත්</b> <span class="s">• ${esc(cname(l))} • ${fdate(l.date)}${l.note?' • '+esc(l.note):''}</span><div class="s">ගත්ත ${l.qty} • විකුණපු ${sq} • ඉතිරි ${lotRem(l)}${prices.length?' • විකුණුම් මිල: '+prices.map(p=>Math.round(p).toLocaleString('en-US')).join(', '):''}</div></div><div style="text-align:right"><b class="${pr>=0?'ok':'bad'}">${rs(pr)}</b><div class="s">ලාභය</div></div></div></summary>
      ${ss.length?ss.map(s=>`<div class="sl" onclick="openDetail('sell','${s.id}')"><span>${esc(cname(s))} • ${effQty(s)} × ${rs(s.unit)}${retQty(s)?' (රිටන් '+retQty(s)+')':''}</span><b class="${profitOf(s)>=0?'ok':'bad'}">${rs(profitOf(s))}</b></div>`).join(''):'<div class="sl">තවම විකුණා නැත</div>'}</details>`;
    }).join('');
    const legRow=legacy.length?`<details class="lot"><summary><div class="row"><div><b>පරණ විකුණුම්</b> <span class="s">(තොගයක් තෝරා නැති)</span></div><div style="text-align:right"><b class="${sum(legacy,profitOf)>=0?'ok':'bad'}">${rs(sum(legacy,profitOf))}</b></div></div></summary>${legacy.map(s=>`<div class="sl" onclick="openDetail('sell','${s.id}')"><span>${esc(cname(s))} • ${effQty(s)} × ${rs(s.unit)}</span><b>${rs(profitOf(s))}</b></div>`).join('')}</details>`:'';
    return `<div class="inst-h"><div class="row"><div class="t">${esc(x.it.name)}</div><div style="text-align:right"><b class="${x.profit>=0?'ok':'bad'}" style="font-size:17px">${rs(x.profit)}</b></div></div><div class="s">විකුණපු ${x.sq} • විකුණුම් ${rs(x.rev)} • ගත්ත වටිනාකම ${rs(x.cost)}</div></div>
    <div class="card">${lotRows||legRow?lotRows+legRow:'<div class="empty">තවම ගැනීම් නැත</div>'}</div>`;
  }).join('');
  return `<div class="card stat"><div class="l">මුළු ලාභය (සියලු භාණ්ඩ)</div><div class="v ${c.profit>=0?'ok':'bad'}" style="font-size:26px">${rs(c.profit)}</div><div class="s">විකුණුම් ${rs(c.st)} − ගත්ත වටිනාකම ${rs(c.cogs)}</div></div>
  <div class="chips">${chip('all','සියල්ල')}${S.items.map(i=>chip(i.id,esc(i.name))).join('')}</div>
  <div class="s" style="margin:0 2px 4px">එක එක මිලට ගත් තොග වෙන වෙනම පෙන්වයි. තොගයක් ඔබලා විකුණුම් වල ලාභය බලන්න.</div>${body}`;
}

/* ---------- ආයතන ---------- */
function institutions(){
  const rows=S.sales.filter(r=>r.instName);
  if(!rows.length)return `<div class="card"><div class="empty">ආයතනයකට ගෙවීමට දුන් විකුණුම් නැත.<br><br>විකුණුමක් <b>නයට</b> ඇතුළත් කරද්දි "ආයතනය" සහ "දුන් දිනය" දාන්න.<br>එවිට මෙතන පේනවා.</div></div>`;
  const g={};rows.forEach(r=>{(g[r.instName]=g[r.instName]||[]).push(r)});
  const names=Object.keys(g).sort((a,b)=>a.localeCompare(b));
  return names.map(n=>{
    const a=g[n].sort((x,y)=>(x.given||x.date)<(y.given||y.date)?1:-1);
    const tot=sum(a,effTotal),pd=sum(a,got);
    return `<div class="inst-h"><div class="t">🏢 ${esc(n)}</div><div class="s">විකුණුම් ${a.length} • මුළු ${rs(tot)} • ලැබුණු ${rs(pd)} • <b class="${tot-pd>0?'warn':'ok'}">ඉතිරි ${rs(tot-pd)}</b></div></div>
    <div class="card">${a.map(r=>{
      const ist=instStatus(r);
      return `<div class="item" onclick="openDetail('sell','${r.id}')"><div class="row"><div><div class="n">${esc(cname(r))}</div><div class="s">${phoneOf(r)}${esc(iname(r.itemId))} ${effQty(r)} • ${rs(effTotal(r))}</div></div><div style="text-align:right"><span class="badge b-p">දුන් දිනය</span><br><b>${fdate(r.given||r.date)}</b></div></div>
      ${ist.length?ist.map(i=>`<div class="irow"><span>${i.no===1?'පළමු':'දෙවන'} වාරිකය • ${rs(i.amount)}</span><span>${i.due} ${i.done?'<span class="badge b-ok">ගෙවා ඇත</span>':i.over?'<span class="badge b-bad">කල් ඉකුත්</span>':i.got>0?'<span class="badge b-warn">කොටසක් ගෙවා ඇත</span>':'<span class="badge b-warn">ගෙවීමට ඇත</span>'}</span></div>`).join(''):`<div class="irow"><span>ඉතිරි ${rs(bal(r))}${r.due?' • '+r.due:''}</span><span>${bal(r)<=0?'<span class="badge b-ok">ගෙවා ඇත</span>':isOver(r)?'<span class="badge b-bad">කල් ඉකුත්</span>':'<span class="badge b-warn">ගෙවීමට ඇත</span>'}</span></div>`}</div>`}).join('')}</div>`;
  }).join('');
}

/* ---------- පුද්ගලයෝ ---------- */
function cstats(id){
  const s=S.sales.filter(r=>r.cid===id),p=S.purchases.filter(r=>r.cid===id);
  return {owe:sum(p,bal),recv:sum(s,bal),sq:sum(s,effQty),n:p.length+s.length};
}
function roleBadges(c){return (c.roles||[]).map(x=>`<span class="badge b-p">${RL[x]}</span>`).join(' ')}
function people(){
  const arr=S.contacts.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .filter(c=>pf==='all'||(c.roles||[]).includes(pf))
    .filter(c=>!q||c.name.toLowerCase().includes(q.toLowerCase())||String(c.phone||'').includes(q));
  const chip=(k,l)=>`<button class="${pf===k?'on':''}" onclick="pf='${k}';render()">${l}</button>`;
  return `<div class="chips">${chip('all','සියල්ල')}${chip('supplier','📥 සැපයුම්කරුවෝ')}${chip('customer','📤 ගැනුම්කරුවෝ')}${chip('agent','🤝 Agents')}</div>
  <input class="search" placeholder="🔍 නමින් හෝ අංකයෙන් සොයන්න" value="${esc(q)}" oninput="q=this.value;render();this.focus()">
  <div class="card row"><span>${pf==='all'?'මුළු පුද්ගලයන්':RL[pf]+'වරු'}</span><b>${arr.length}</b></div>
  <div class="card">${arr.length?arr.map(c=>{const t=cstats(c.id);return `<div class="item" onclick="openContact('${c.id}')"><div class="row"><div><div class="n">${esc(c.name)}</div><div class="s">${c.phone?'📞 '+esc(c.phone):'📞 අංකයක් නැත'}${c.address?'<br>📍 '+esc(c.address):''}</div><div style="margin-top:3px">${roleBadges(c)}</div></div><div style="text-align:right">${t.owe>0?`<div class="bad" style="font-size:12px">මම ගෙවිය යුතු<br><b>${rs(t.owe)}</b></div>`:''}${t.recv>0?`<div class="ok" style="font-size:12px">මට ලැබිය යුතු<br><b>${rs(t.recv)}</b></div>`:''}</div></div></div>`}).join(''):'<div class="empty">මෙම කොටසේ කිසිවෙක් නැත.<br>පහළ බොත්තමෙන් එකතු කරන්න.</div>'}</div>`;
}
function contactFields(c,withRoles,defRoles){
  c=c||{};const rl=c.roles||defRoles||[];
  return `<label>නම *</label><input id="c_name" value="${esc(c.name||'')}" placeholder="සම්පූර්ණ නම">
  <label>දුරකථන අංකය (අවශ්‍ය නම් පමණක්)</label><input id="c_phone" type="tel" inputmode="tel" value="${esc(c.phone||'')}" placeholder="07X XXX XXXX">
  <label>ලිපිනය (අවශ්‍ය නම් පමණක්)</label><textarea id="c_addr" rows="2" placeholder="ලිපිනය">${esc(c.address||'')}</textarea>
  ${withRoles?`<label>මොහු කවුද? (එකකට වඩා තෝරන්න පුළුවන්)</label><div class="rolebox">${Object.keys(RL).map(k=>`<label class="chk"><input type="checkbox" id="c_r_${k}" ${rl.includes(k)?'checked':''}> ${k==='supplier'?'සැපයුම්කරු (මම භාණ්ඩ ගන්නේ මෙයාගෙන්)':k==='customer'?'ගැනුම්කරු (මම භාණ්ඩ විකුණන්නේ මෙයාට)':'Agent (මා වෙනුවෙන් විකුණන කෙනා)'}</label>`).join('')}</div>`:''}`;
}
function openContactForm(id){
  const c=id?cget(id):null;
  $('sheet').innerHTML=`<h3>${c?'✏️ විස්තර වෙනස් කරන්න':'👤 අලුත් පුද්ගලයෙක්'}</h3>${contactFields(c,true,pf!=='all'?[pf]:[])}
  <button class="btn" onclick="saveContact('${id||''}')">සුරකින්න</button><button class="btn sec" onclick="closeM()">අවලංගු</button>`;
  $('modal').classList.add('show');
}
function saveContact(id){
  const name=$('c_name').value.trim(),phone=$('c_phone').value.trim(),address=$('c_addr').value.trim();
  const roles=Object.keys(RL).filter(k=>$('c_r_'+k).checked);
  if(!name)return alert('නම ඇතුළත් කරන්න');
  if(!roles.length)return alert('මොහු කවුද කියලා (සැපයුම්කරු / ගැනුම්කරු / Agent) තෝරන්න');
  if(id){const c=cget(id);c.name=name;c.phone=phone;c.address=address;c.roles=roles;[...S.purchases,...S.sales].forEach(r=>{if(r.cid===id)r.party=name})}
  else S.contacts.push({id:uid(),name,phone,address,roles});
  save();closeM();render();
}
function openContact(id){
  const c=cget(id);if(!c)return;
  const sales=S.sales.filter(r=>r.cid===id),buys=S.purchases.filter(r=>r.cid===id),rets=S.returns.filter(x=>x.cid===id);
  const ids=[...new Set([...sales.map(r=>r.itemId),...buys.map(r=>r.itemId)])];
  const soldRows=ids.filter(i=>sales.some(s=>s.itemId===i)).map(i=>{
    const ss=sales.filter(s=>s.itemId===i);const q1=sum(ss,s=>s.qty),rq=sum(ss,retQty);
    return `<tr><td>${esc(iname(i))}</td><td>${q1}</td><td>${rq}</td><td><b>${q1-rq}</b></td><td>${rs(sum(ss,effTotal))}</td></tr>`}).join('');
  const buyRows=ids.filter(i=>buys.some(s=>s.itemId===i)).map(i=>{
    const ss=buys.filter(s=>s.itemId===i);
    return `<tr><td>${esc(iname(i))}</td><td><b>${sum(ss,s=>s.qty)}</b></td><td>${rs(sum(ss,s=>s.total))}</td></tr>`}).join('');
  const recs=[...buys.map(r=>({r,t:'buy'})),...sales.map(r=>({r,t:'sell'}))].sort((a,b)=>a.r.date<b.r.date?1:-1);
  $('sheet').innerHTML=`<h3>${esc(c.name)}</h3>
  <div class="card" style="box-shadow:none;background:#faf5f8"><div class="s" style="line-height:1.9;font-size:14px;color:var(--tx)">📞 ${c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:'-'}<br>📍 ${esc(c.address||'-')}<br>${roleBadges(c)}</div></div>
  ${sales.length||rets.length?`<h2>📤 මොහුට විකුණපු / මොහු ගත්ත</h2><div class="card" style="box-shadow:none"><table class="tbl"><tr><th>භාණ්ඩය</th><th>ගත්ත</th><th>රිටන්</th><th>ශුද්ධ</th><th>වටිනාකම</th></tr>${soldRows}
  <tr><td><b>එකතුව</b></td><td>${sum(sales,s=>s.qty)}</td><td>${sum(sales,retQty)}</td><td><b>${sum(sales,effQty)}</b></td><td><b>${rs(sum(sales,effTotal))}</b></td></tr></table>
  <div class="s" style="line-height:1.9;margin-top:8px;font-size:13px;color:var(--tx)">මුළු විකුණුම් (රිටන් කලින්): ${rs(sum(sales,s=>s.total))}<br>රිටන් වටිනාකම: <b class="bad">${rs(sum(sales,retAmt))}</b> (${sum(sales,retQty)} ක්)<br>ආපසු ගෙවූ මුදල: ${rs(sum(sales,refunded))}<br>ලැබුණු මුදල: <b class="ok">${rs(sum(sales,got))}</b><br>ඉතිරි (මට ලැබිය යුතු): <b class="warn">${rs(sum(sales,bal))}</b><br>මොහුගෙන් ලැබෙන ලාභය: <b class="${sum(sales,profitOf)>=0?'ok':'bad'}">${rs(sum(sales,profitOf))}</b></div></div>`:''}
  ${buys.length?`<h2>📥 මා මොහුගෙන් ගත්ත</h2><div class="card" style="box-shadow:none"><table class="tbl"><tr><th>භාණ්ඩය</th><th>ගණන</th><th>වටිනාකම</th></tr>${buyRows}</table>
  <div class="s" style="line-height:1.9;margin-top:8px;font-size:13px;color:var(--tx)">ගෙවූ මුදල: <b class="ok">${rs(sum(buys,paid))}</b><br>ඉතිරි (මම ගෙවිය යුතු): <b class="bad">${rs(sum(buys,bal))}</b></div></div>`:''}
  <h2>ගනුදෙනු</h2><div class="card" style="box-shadow:none">${recs.length?recs.map(({r,t})=>`<div class="item" onclick="openDetail('${t}','${r.id}')"><div class="row"><div><div class="n">${t==='buy'?'📥 ගැනීම':'📤 විකුණුම'} • ${esc(iname(r.itemId))}</div><div class="s">${fdate(r.date)} • ${r.qty} × ${rs(r.unit)}${t==='sell'&&retQty(r)?' • ↩️ '+retQty(r):''}</div></div><div style="text-align:right"><b>${rs(effTotal(r))}</b><br><span class="s">ඉතිරි ${rs(bal(r))}</span></div></div></div>`).join(''):'<div class="empty">ගනුදෙනු නැත</div>'}</div>
  ${rets.length?`<h2>↩️ රිටන්</h2><div class="card" style="box-shadow:none">${rets.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).map(x=>`<div class="item" onclick="openReturn('${x.id}')"><div class="row"><div><div class="n">${esc(iname(x.itemId))} • ${x.qty} ක්</div><div class="s">දිනය: ${fdate(x.date)}${x.note?' • '+esc(x.note):''}</div></div><b class="bad">${rs(x.amount)}</b></div></div>`).join('')}</div>`:''}
  ${sales.length?`<button class="btn" onclick="openReturnForm('${sales.slice().sort((a,b)=>a.date<b.date?1:-1)[0].id}')">↩️ රිටන් එකක් එකතු කරන්න</button>`:''}
  <button class="btn sec" onclick="openContactForm('${id}')">✏️ විස්තර වෙනස් කරන්න</button>
  <button class="btn del" onclick="delContact('${id}')">මකන්න</button>
  <button class="btn sec" onclick="closeM()">වසන්න</button>`;
  $('modal').classList.add('show');
}
function delContact(id){
  if(S.purchases.some(r=>r.cid===id)||S.sales.some(r=>r.cid===id))return alert('මොහුට ගනුදෙනු ඇති නිසා මැකිය නොහැක');
  if(!confirm('මෙම පුද්ගලයා මකන්නද?'))return;
  S.contacts=S.contacts.filter(c=>c.id!==id);save();closeM();render();
}

/* ---------- තවත් (භාණ්ඩ වර්ග, Backup) ---------- */
function more(){
  const st=itemStats();
  return `<div class="card"><h3 style="margin:0 0 6px">🏷️ භාණ්ඩ වර්ග</h3><div class="s">සාරි, ලුංගි, ටී ෂර්ට් වගේ වර්ග මෙතනින් එකතු කරන්න / වෙනස් කරන්න.</div>
  <div style="margin-top:6px">${st.map(x=>`<div class="item row"><span><b>${esc(x.it.name)}</b> <span class="s">• තොගය ${x.stock}</span></span><span><a onclick="openItemForm('${x.it.id}')" style="color:var(--p)">✏️</a> <a onclick="delItem('${x.it.id}')" style="color:var(--bad);margin-left:10px">✕</a></span></div>`).join('')}</div>
  <button class="btn" onclick="openItemForm()">＋ අලුත් භාණ්ඩ වර්ගයක්</button></div>
  <div class="card"><h3 style="margin:0 0 6px">💾 දත්ත Backup</h3><div class="s" style="font-size:13px">දත්ත ඔබේ phone එකේම සුරැකෙනවා. Phone එක මාරු කරන්න කලින් හෝ app එක අස්ථාපනය කරන්න කලින් backup එකක් ගන්න.</div>
  <button class="btn" onclick="exportData()">Backup ගන්න (ගොනුවක් විදිහට)</button>
  <button class="btn sec" onclick="copyBackup()">Backup එක text එකක් විදිහට copy කරන්න</button>
  <button class="btn sec" onclick="$('imp').click()">ගොනුවකින් ආපසු දාන්න</button>
  <button class="btn sec" onclick="pasteRestore()">Text එකකින් ආපසු දාන්න (paste)</button>
  <input type="file" id="imp" style="display:none" onchange="importData(this)"></div>
  <div class="card"><button class="btn del" style="margin:0" onclick="wipe()">සියලු දත්ත මකන්න</button></div>`;
}
function openItemForm(id){
  const it=id?S.items.find(i=>i.id===id):null;
  $('sheet').innerHTML=`<h3>${it?'✏️ නම වෙනස් කරන්න':'🏷️ අලුත් භාණ්ඩ වර්ගයක්'}</h3><label>භාණ්ඩයේ නම</label><input id="it_name" value="${esc(it?it.name:'')}" placeholder="උදා: සාරි, ලුංගි, ටී ෂර්ට්">
  <button class="btn" onclick="saveItem('${id||''}')">සුරකින්න</button><button class="btn sec" onclick="closeM()">අවලංගු</button>`;
  $('modal').classList.add('show');
}
function saveItem(id){
  const nm=$('it_name').value.trim();if(!nm)return alert('නම ඇතුළත් කරන්න');
  if(S.items.some(i=>i.id!==id&&i.name.toLowerCase()===nm.toLowerCase()))return alert('මේ නමින් වර්ගයක් දැනටමත් ඇත');
  if(id)S.items.find(i=>i.id===id).name=nm;else S.items.push({id:uid(),name:nm});
  save();closeM();render();
}
function delItem(id){
  if(S.purchases.some(r=>r.itemId===id)||S.sales.some(r=>r.itemId===id))return alert('මෙම වර්ගයට ගනුදෙනු ඇති නිසා මැකිය නොහැක');
  if(!confirm('මෙම වර්ගය මකන්නද?'))return;
  S.items=S.items.filter(i=>i.id!==id);save();render();
}

/* ---------- Form (ගැනීම් / විකුණුම්) ---------- */
let F={};
function roleFor(){return F.t==='buy'?'supplier':(F.kind==='agent'?'agent':'customer')}
function fillSel(){
  const role=roleFor();
  const cs=S.contacts.filter(c=>(c.roles||[]).includes(role)).sort((a,b)=>a.name.localeCompare(b.name));
  $('f_cid').innerHTML='<option value="">— තෝරන්න —</option>'+cs.map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?' • '+esc(c.phone):''}</option>`).join('')+'<option value="__new">＋ අලුත් '+RL[role]+' කෙනෙක් එකතු කරන්න</option>';
  $('newC').style.display='none';
}
function pickC(){$('newC').style.display=$('f_cid').value==='__new'?'block':'none'}
function pickItem(){const n=$('f_item').value==='__new';$('newItem').style.display=n?'block':'none';if(F.t==='sell')fillLots()}
function fillLots(){
  const item=$('f_item').value;
  const lots=S.purchases.filter(p=>p.itemId===item).sort((a,b)=>{const ra=lotRem(a)>0?0:1,rb=lotRem(b)>0?0:1;return ra-rb||(a.date<b.date?1:-1)});
  $('f_lot').innerHTML=lots.length?'<option value="">— තෝරන්න —</option>'+lots.map(p=>`<option value="${p.id}">රු.${Math.round(p.unit)} ට ගත් • ඉතිරි ${lotRem(p)}${lotRem(p)<=0?' (අවසන්)':''}${p.note?' • '+esc(p.note):''} • ${esc(cname(p))}</option>`).join(''):'<option value="">මෙම වර්ගයට ගැනීමක් නැත (මුලින් ගැනීමක් ඇතුළත් කරන්න)</option>';
  calcT();
}
function pickLot(){
  const l=S.purchases.find(p=>p.id===$('f_lot').value);
  if(l){const last=S.sales.filter(s=>s.lotId===l.id).sort((a,b)=>(b.date||'')<(a.date||'')?-1:1)[0];if(last&&!$('f_unit').value)$('f_unit').value=last.unit}
  calcT();
}
function toggleTwo(){const on=$('f_two').checked;$('oneBox').style.display=on?'none':'block';$('twoBox').style.display=on?'block':'none';calcI()}
function calcI(){
  const total=(+$('f_qty').value||0)*(+$('f_unit').value||0),adv=+$('f_adv').value||0,i1=+$('f_i1').value||0;
  const rem=Math.max(0,total-adv);$('f_i2txt').innerHTML='ඉතිරි මුදල: <b>'+rs(rem)+'</b> • දෙවන වාරිකය: <b>'+rs(Math.max(0,rem-i1))+'</b>';
}
function calcT(){
  const qn=+$('f_qty').value||0,u=+$('f_unit').value||0;
  $('f_tot').textContent=rs(qn*u);
  if(F.t==='sell'){
    const l=S.purchases.find(p=>p.id===$('f_lot').value);
    const el=$('f_prof');
    if(l&&u>0&&qn>0){const p=qn*(u-l.unit);el.innerHTML='ලාභය: <b class="'+(p>=0?'ok':'bad')+'">'+rs(p)+'</b> <span class="s">(ගත්ත මිල '+rs(l.unit)+' • එකකට '+rs(u-l.unit)+')</span>'}
    else el.innerHTML='<span class="s">ලාභය: තොගය, ගණන සහ මිල දැමූ විට පෙනේ</span>';
  }
  if($('f_i2txt'))calcI();
}
function openForm(){
  if(tab==='people')return openContactForm();
  if(tab==='ret')return openReturnForm();
  const t=tab==='buy'?'buy':tab==='sell'?'sell':null;
  if(!t){ $('sheet').innerHTML=`<h3>මොකක්ද එකතු කරන්නේ?</h3><button class="btn" onclick="tab='buy';render();openForm()">📥 භාණ්ඩ ගැනීමක්</button><button class="btn" onclick="tab='sell';render();openForm()">📤 විකුණුමක්</button><button class="btn sec" onclick="closeM()">වසන්න</button>`; $('modal').classList.add('show'); return; }
  F={t,type:'cash',kind:'direct'};
  const insts=[...new Set(S.sales.map(r=>r.instName).filter(Boolean))];
  const itemOpts=S.items.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')+(t==='buy'?'<option value="__new">＋ අලුත් වර්ගයක් එකතු කරන්න</option>':'');
  $('sheet').innerHTML=`<h3>${t==='buy'?'📥 භාණ්ඩ ගැනීමක්':'📤 විකුණුමක්'}</h3>
  ${t==='sell'?`<label>විකුණන ආකාරය</label><div class="seg" id="kseg"><button class="on" data-k="direct">මම කෙලින්ම</button><button data-k="agent">Agent කෙනෙක් හරහා</button></div>`:''}
  <label>${t==='buy'?'භාණ්ඩ ගන්නේ කවුරුන්ගෙන්ද (සැපයුම්කරු)':'කාටද විකුණන්නේ'}</label>
  <select id="f_cid" onchange="pickC()"></select>
  <div id="newC" style="display:none;background:#faf5f8;border-radius:10px;padding:2px 10px 10px;margin-top:8px">${contactFields(null,false)}</div>
  <label>භාණ්ඩ වර්ගය</label><select id="f_item" onchange="pickItem()">${itemOpts}</select>
  <div id="newItem" style="display:none"><label>අලුත් වර්ගයේ නම</label><input id="f_newitem" placeholder="උදා: රෙද්ද, සාය"></div>
  ${t==='sell'?`<label>මොන මිලට ගත් තොගයෙන්ද විකුණන්නේ</label><select id="f_lot" onchange="pickLot()"></select>`:`<label>විස්තරය (වර්ණය / නිර්මාණය — අවශ්‍ය නම් පමණක්)</label><input id="f_desc" placeholder="උදා: රතු කොට්ටන්">`}
  <label>දිනය</label><input type="date" id="f_date" value="${today()}">
  <div class="grid"><div><label>ගණන</label><input type="number" inputmode="numeric" id="f_qty" oninput="calcT()"></div><div><label>${t==='buy'?'එකක් ගත්ත මිල (රු.)':'එකක් විකුණන මිල (රු.)'}</label><input type="number" inputmode="decimal" id="f_unit" oninput="calcT()"></div></div>
  <div class="total">මුළු මුදල: <b id="f_tot">රු. 0</b>${t==='sell'?'<div id="f_prof" style="margin-top:4px"></div>':''}</div>
  <label>ගෙවීමේ ක්‍රමය</label><div class="seg" id="tseg"><button class="on" data-k="cash">අත්පිට මුදලට</button><button data-k="credit">නයට</button></div>
  <div id="creditBox" style="display:none">
    <label>දැනටමත් ගෙවූ/ලැබූ මුදල (රු.)</label><input type="number" inputmode="decimal" id="f_adv" placeholder="0" oninput="calcI()">
    ${t==='sell'?`<label>🏢 ආයතනය (ගෙවීමට දුන්න ආයතනය)</label><input id="f_inst" list="instlist" placeholder="ආයතනයේ නම (අවශ්‍ය නම්)"><datalist id="instlist">${insts.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <label>ආයතනයට දුන් දිනය</label><input type="date" id="f_given" value="${today()}">`:''}
    <label class="chk"><input type="checkbox" id="f_two" onchange="toggleTwo()"> වාරික දෙකකට බෙදන්න</label>
    <div id="oneBox"><label>ඉතිරි මුදල ගෙවිය යුතු දිනය</label><input type="date" id="f_due"></div>
    <div id="twoBox" style="display:none">
      <label>පළමු වාරිකය (රු.)</label><input type="number" inputmode="decimal" id="f_i1" oninput="calcI()">
      <label>පළමු වාරිකයේ දිනය</label><input type="date" id="f_d1">
      <div class="total" id="f_i2txt"></div>
      <label>දෙවන වාරිකයේ දිනය</label><input type="date" id="f_d2">
    </div>
  </div>
  <label>සටහනක් (අවශ්‍ය නම්)</label><input id="f_note">
  <button class="btn" onclick="saveForm()">සුරකින්න</button><button class="btn sec" onclick="closeM()">අවලංගු</button>`;
  fillSel();if(t==='sell')fillLots();else calcT();
  document.querySelectorAll('#tseg button').forEach(b=>b.onclick=()=>{F.type=b.dataset.k;document.querySelectorAll('#tseg button').forEach(x=>x.classList.toggle('on',x===b));$('creditBox').style.display=F.type==='credit'?'block':'none'});
  document.querySelectorAll('#kseg button').forEach(b=>b.onclick=()=>{F.kind=b.dataset.k;document.querySelectorAll('#kseg button').forEach(x=>x.classList.toggle('on',x===b));fillSel()});
  $('modal').classList.add('show');
}
function saveForm(){
  const qty=+$('f_qty').value, unit=+$('f_unit').value, date=$('f_date').value||today();
  const sel=$('f_cid').value; let ct=null, newCt=null, newIt=null;
  if(!sel)return alert('පුද්ගලයා තෝරන්න');
  if(sel==='__new'){
    const nm=$('c_name').value.trim();
    if(!nm)return alert('නම ඇතුළත් කරන්න');
    newCt={id:uid(),name:nm,phone:$('c_phone').value.trim(),address:$('c_addr').value.trim(),roles:[roleFor()]};ct=newCt;
  } else ct=cget(sel);
  let itemId=$('f_item').value;
  if(itemId==='__new'){
    const nm=$('f_newitem').value.trim();
    if(!nm)return alert('අලුත් වර්ගයේ නම ඇතුළත් කරන්න');
    const ex=S.items.find(i=>i.name.toLowerCase()===nm.toLowerCase());
    if(ex)itemId=ex.id;else{newIt={id:uid(),name:nm};itemId=newIt.id}
  }
  let lot=null;
  if(F.t==='sell'){
    lot=S.purchases.find(p=>p.id===$('f_lot').value);
    if(!lot)return alert('විකුණන්නේ මොන මිලට ගත් තොගයෙන්ද කියලා තෝරන්න');
  }
  if(!(qty>0))return alert('ගණන ඇතුළත් කරන්න');
  if($('f_unit').value===''||!(unit>=0))return alert('මිල ඇතුළත් කරන්න');
  const total=qty*unit;
  const r={id:uid(),cid:ct.id,itemId,date,party:ct.name,qty,unit,total,type:F.type,note:'',payments:[],due:''};
  const note=$('f_note').value.trim();
  if(F.t==='buy'){r.note=$('f_desc').value.trim();if(note)r.note=r.note?r.note+' • '+note:note}
  else{r.note=note;r.kind=F.kind;r.lotId=lot.id;r.cost=lot.unit}
  if(F.type==='cash'){r.payments=[{date,amount:total}]}
  else{
    const adv=+$('f_adv').value||0;
    if(adv>total)return alert('ගෙවූ මුදල මුළු මුදලට වඩා වැඩියි');
    if(adv>0)r.payments.push({date,amount:adv});
    const rem=total-adv;
    if(F.t==='sell'){
      const nm=$('f_inst').value.trim();
      if(nm){r.instName=nm;r.given=$('f_given').value||today()}
    }
    if($('f_two').checked&&rem>0){
      const i1=+$('f_i1').value,d1=$('f_d1').value,d2=$('f_d2').value;
      if(!(i1>0)||i1>=rem)return alert('පළමු වාරිකය 0ට වඩා වැඩි සහ ඉතිරි මුදලට වඩා අඩු විය යුතුයි');
      if(!d1||!d2)return alert('වාරික දෙකේම දිනයන් ඇතුළත් කරන්න');
      r.instBase=adv;r.inst=[{amount:i1,due:d1},{amount:rem-i1,due:d2}];
      r.due=d1;
    } else {
      r.due=$('f_due').value;
      if(!r.due&&rem>0)return alert('ගෙවිය යුතු දිනය ඇතුළත් කරන්න');
    }
  }
  if(F.t==='sell'){
    const rm=lotRem(lot); if(qty>rm && !confirm(`මේ තොගයේ ඉතිරි ඇත්තේ ${rm}ක් පමණයි. ඒත් සුරකින්නද?`))return;
    S.sales.push(r);
  } else S.purchases.push(r);
  if(newCt)S.contacts.push(newCt);
  if(newIt)S.items.push(newIt);
  syncDue(r);
  save();closeM();render();
}

/* ---------- Detail ---------- */
const get=(t,id)=>(t==='buy'?S.purchases:S.sales).find(x=>x.id===id);
function openDetail(t,id){
  const r=get(t,id); if(!r)return;
  const b=bal(r);
  const ct=cget(r.cid)||{};
  const ist=instStatus(r);
  const rets=isSale(r)?retsOf(r):[];
  $('sheet').innerHTML=`<h3>${esc(cname(r))}${r.kind==='agent'?' (Agent)':''}</h3>
  <div class="card" style="box-shadow:none;background:#faf5f8"><div class="s" style="line-height:1.8;font-size:14px;color:var(--tx)">${ct.phone?`📞 <a href="tel:${esc(ct.phone)}">${esc(ct.phone)}</a><br>`:''}${ct.address?`📍 ${esc(ct.address)}<br>`:''}භාණ්ඩය: <b>${esc(iname(r.itemId))}</b>${r.note&&!isSale(r)?' ('+esc(r.note)+')':''}<br>දිනය: ${fdate(r.date)}<br>ගණන: ${r.qty} × ${rs(r.unit)}${isSale(r)?`<br>තොගයේ ගත්ත මිල: <b>${rs(r.cost)}</b> • එකකට ලාභය: <b class="${r.unit-r.cost>=0?'ok':'bad'}">${rs(r.unit-r.cost)}</b><br>මෙම විකුණුමේ ලාභය: <b class="${profitOf(r)>=0?'ok':'bad'}">${rs(profitOf(r))}</b>`:''}<br>මුළු මුදල: <b>${rs(r.total)}</b>${rets.length?`<br>රිටන් වටිනාකම: <b class="bad">−${rs(retAmt(r))}</b> (${retQty(r)} ක්)<br>ශුද්ධ මුදල: <b>${rs(effTotal(r))}</b>${refunded(r)?`<br>ආපසු ගෙවූ: ${rs(refunded(r))}`:''}`:''}<br>ක්‍රමය: ${r.type==='cash'?'අත්පිට':'නයට'}<br>${t==='buy'?'ගෙවූ':'ලැබූ'} මුදල: <b class="ok">${rs(got(r))}</b><br>ඉතිරි: <b class="${b>0?'bad':'ok'}">${rs(b)}</b>${r.due&&b>0?`<br>ඊළඟ දිනය: <b>${r.due}</b>${isOver(r)?' ⚠️':''}`:''}${r.instName?`<br>🏢 ආයතනය: <b>${esc(r.instName)}</b> • දුන් දිනය: <b>${fdate(r.given)}</b>`:''}${r.note&&isSale(r)?`<br>සටහන: ${esc(r.note)}`:''}</div></div>
  ${ist.length?`<h2>වාරික</h2><div class="card" style="box-shadow:none">${ist.map(i=>`<div class="irow"><span>${i.no===1?'පළමු':'දෙවන'} වාරිකය • ${rs(i.amount)}</span><span>${i.due} ${i.done?'<span class="badge b-ok">ගෙවා ඇත</span>':i.over?'<span class="badge b-bad">කල් ඉකුත්</span>':'<span class="badge b-warn">ගෙවීමට ඇත</span>'}</span></div>`).join('')}</div>`:''}
  ${rets.length?`<h2>↩️ රිටන්</h2><div class="card" style="box-shadow:none">${rets.map(x=>`<div class="item row" onclick="closeM();openReturn('${x.id}')"><span>${x.qty} ක් • ${fdate(x.date)}</span><b class="bad">${rs(x.amount)}</b></div>`).join('')}</div>`:''}
  ${t==='sell'&&r.type==='credit'?`<label>🏢 ආයතනය (ගෙවීමට දුන්න)</label><input id="d_inst" value="${esc(r.instName||'')}" onchange="setInst('${id}')">
  <label>ආයතනයට දුන් දිනය</label><input type="date" id="d_given" value="${r.given||''}" onchange="setInst('${id}')">`:''}
  <h2>ගෙවීම් ඉතිහාසය</h2><div class="card" style="box-shadow:none">${(r.payments||[]).length?r.payments.map((p,i)=>`<div class="item row"><span>${p.date}</span><span><b>${rs(p.amount)}</b> <a onclick="delPay('${t}','${id}',${i})" style="color:var(--bad);margin-left:8px">✕</a></span></div>`).join(''):'<div class="empty">ගෙවීම් නැත</div>'}</div>
  ${b>0?`<label>${t==='buy'?'මම ගෙවන':'මට ලැබුණු'} මුදල (රු.)</label><input type="number" inputmode="decimal" id="p_amt" value="${Math.round(r.inst?Math.min(b,(ist.find(x=>!x.done)||{amount:b}).amount-(ist.find(x=>!x.done)||{got:0}).got):b)}">
  <label>දිනය</label><input type="date" id="p_date" value="${today()}">
  <button class="btn" onclick="addPay('${t}','${id}')">ගෙවීමක් එකතු කරන්න</button>
  ${r.inst?'':`<label>අලුත් අවසන් දිනයක් (අවශ්‍ය නම්)</label><input type="date" id="p_due" value="${r.due||''}" onchange="chDue('${t}','${id}',this.value)">`}`:''}
  ${t==='sell'&&r.qty-retQty(r)>0?`<button class="btn sec" onclick="openReturnForm('${id}')">↩️ රිටන් එකක් එකතු කරන්න</button>`:''}
  <button class="btn del" onclick="delRec('${t}','${id}')">මෙම ඇතුළත් කිරීම මකන්න</button>
  <button class="btn sec" onclick="closeM()">වසන්න</button>`;
  $('modal').classList.add('show');
}
function setInst(id){const r=get('sell',id);const n=$('d_inst').value.trim();r.instName=n;r.given=n?($('d_given').value||today()):'';save();render()}
function addPay(t,id){const r=get(t,id),a=+$('p_amt').value;if(!(a>0))return alert('මුදල ඇතුළත් කරන්න');if(a>bal(r)+0.5)return alert('ඉතිරි මුදලට වඩා වැඩියි');r.payments.push({date:$('p_date').value||today(),amount:a});syncDue(r);save();render();openDetail(t,id)}
function delPay(t,id,i){if(!confirm('මෙම ගෙවීම මකන්නද?'))return;const r=get(t,id);r.payments.splice(i,1);if(r.inst&&r.inst.length&&bal(r)>0){r.due=r.inst[0].due;syncDue(r)}save();render();openDetail(t,id)}
function chDue(t,id,v){get(t,id).due=v;save();render()}
function delRec(t,id){
  const r=get(t,id);if(!r)return;
  if(t==='buy'&&S.sales.some(s=>s.lotId===id))return alert('මෙම තොගයෙන් විකුණුම් ඇති නිසා මැකිය නොහැක. මුලින් ඒ විකුණුම් මකන්න.');
  if(!confirm('මෙය සම්පූර්ණයෙන්ම මකන්නද?'+(t==='sell'&&retsOf(r).length?' (මෙයට අදාළ රිටන් ද මැකේ)':'')))return;
  if(t==='buy')S.purchases=S.purchases.filter(x=>x.id!==id);else{S.sales=S.sales.filter(x=>x.id!==id);S.returns=S.returns.filter(x=>x.saleId!==id)}
  save();closeM();render();
}
function closeM(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});

/* ---------- Backup ---------- */
const plugins=()=>(window.Capacitor&&window.Capacitor.Plugins)||{};
async function exportData(){
  const json=JSON.stringify(S);
  const fname='zara-looms-backup-'+today()+'.json';
  const P=plugins();
  if(P.Filesystem&&P.Share){
    try{
      const r=await P.Filesystem.writeFile({path:fname,data:json,directory:'CACHE',encoding:'utf8'});
      await P.Share.share({title:'Zara Looms Backup',files:[r.uri],dialogTitle:'Backup එක සුරකින්න / යවන්න'});
      return;
    }catch(e){
      if(/cancel/i.test(String((e&&e.message)||e)))return;
    }
  }
  try{
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
  alert('ගොනුව ලබා ගත නොහැකි නම්, "Backup එක text එකක් විදිහට copy කරන්න" බොත්තම භාවිතා කරන්න.');
}
function copyBackup(){
  const json=JSON.stringify(S);
  $('sheet').innerHTML=`<h3>📋 Backup text එක</h3><div class="s" style="font-size:13px">පහළ text එක සම්පූර්ණයෙන්ම copy කරලා WhatsApp / Notes / Gmail (ඔයාටම යවන්න) එකක සුරකින්න. ආපසු දාන්න ඕන වුණාම "Text එකකින් ආපසු දාන්න" වලින් paste කරන්න.</div>
  <textarea id="bk_txt" rows="8" readonly style="margin-top:10px;font-size:11px">${esc(json)}</textarea>
  <button class="btn" onclick="doCopy()">📋 Copy කරන්න</button><button class="btn sec" onclick="closeM()">වසන්න</button>`;
  $('modal').classList.add('show');
}
function doCopy(){
  const t=$('bk_txt');t.focus();t.select();t.setSelectionRange(0,t.value.length);
  let ok=false;
  try{ok=document.execCommand('copy')}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value).then(()=>alert('Copy වුණා ✅'),()=>alert('Text එක අතින් select කරලා copy කරන්න'));return}
  alert(ok?'Copy වුණා ✅':'Text එක අතින් select කරලා copy කරන්න');
}
function pasteRestore(){
  $('sheet').innerHTML=`<h3>📥 Text එකකින් ආපසු දාන්න</h3><div class="s" style="font-size:13px">කලින් copy කරපු backup text එක මෙතන paste කරන්න.</div>
  <textarea id="rs_txt" rows="8" style="margin-top:10px;font-size:11px" placeholder="මෙතන paste කරන්න"></textarea>
  <button class="btn" onclick="applyImport($('rs_txt').value,true)">ආපසු දාන්න</button><button class="btn sec" onclick="closeM()">අවලංගු</button>`;
  $('modal').classList.add('show');
}
function applyImport(text,fromSheet){
  try{
    const d=JSON.parse(String(text).trim());
    if(!Array.isArray(d.purchases)||!Array.isArray(d.sales))throw 0;
    if(!confirm('දැනට තියෙන දත්ත මේකෙන් ප්‍රතිස්ථාපනය වෙනවා. සුදානම්ද?'))return;
    S=d;norm();save();if(fromSheet)closeM();render();alert('සාර්ථකයි ✅');
  }catch(e){alert('වැරදි backup එකක්')}
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{applyImport(rd.result,false);inp.value=''};
  rd.onerror=()=>alert('ගොනුව කියවීමට නොහැකි විය');
  rd.readAsText(f);
}
function wipe(){if(confirm('සියලු දත්ත මැකෙනවා! සහතිකද?')&&confirm('නැවත ආපසු ගන්න බැහැ. මකන්නද?')){S={purchases:[],sales:[],contacts:[],items:[],returns:[]};norm();save();render()}}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
norm();save();
render();
</script>
</body>
